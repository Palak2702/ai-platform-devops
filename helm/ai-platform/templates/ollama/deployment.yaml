apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-platform.fullname" . }}-ollama
  namespace: {{ .Values.namespace }}
  labels:
    app: ollama
spec:
  replicas: {{ .Values.ollama.replicaCount }}

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama

    spec:
      containers:
        - name: ollama

          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 11434
              protocol: TCP

          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}

          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama

      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: {{ include "ai-platform.fullname" . }}-ollama-pvc