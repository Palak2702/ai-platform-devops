apiVersion: apps/v1
kind: Deployment

metadata:
  name: open-webui
  namespace: ai-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: open-webui

  template:
    metadata:
      labels:
        app: open-webui

    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main

          ports:
            - containerPort: 8080


          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3



          env:
            - name: OLLAMA_BASE_URL
              valueFrom: 
                configMapKeyRef: 
                  name: open-webui-config
                  key: OLLAMA_BASE_URL


            - name: WEBUI_AUTH_SECRET_KEY
              valueFrom:
                 secretKeyRef:
                  name: open-webui-secret
                  key: WEBUI_AUTH_SECRET_KEY      

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"

          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data

      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-pvc